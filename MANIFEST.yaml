name: belarusian_llm_training_superpack
version: "2026-05"
created_utc: "2026-05-11T15:29:24Z"
purpose: "Production-oriented nanochat pack for Belarusian-only LLM training."
targets:
  local_main: "Linux/Ubuntu/WSL2, NVIDIA RTX 3070 Ti 8GB VRAM, NANOCHAT_DTYPE=float16"
  remote: ["Kaggle", "Google Colab"]
language_policy:
  target_language: "Belarusian"
  training_text_policy: "Accepted corpus rows and assistant SFT answers must pass the Belarusian detector; doubtful rows go to quarantine."
  detector: "data_pipeline/detect_belarusian.py"
inputs:
  chat_log: "original_inputs/chat.txt"
  input_checksums: "original_inputs/input_sha256s.txt"
  audits: ["original_inputs/source_audit_report.md", "CHANGES_FROM_INPUTS.md"]
entrypoints:
  smoke_3070ti: 'bash local/run_all_3070ti_smoke.sh --nanochat-dir "$HOME/src/nanochat"'
  safe_3070ti: 'bash local/run_all_3070ti_safe.sh --nanochat-dir "$HOME/src/nanochat"'
  web_chat: 'bash local/run_chat_web.sh --nanochat-dir "$HOME/src/nanochat" --model-tag be-d4-smoke'
  web_health: 'bash local/test_chat_web_health.sh --nanochat-dir "$HOME/src/nanochat" --model-tag be-d4-smoke'
self_checks:
  bash_syntax: "passed before packaging"
  pytest: "8 passed before packaging"
  sft_jsonl_validation: "0 errors, 0 warnings on seed_sft/*.jsonl before packaging"
integrity:
  manifest_self_hash_policy: "MANIFEST.yaml and SHA256SUMS.txt are intentionally excluded from the MANIFEST.yaml file list."
  full_file_hashes: "SHA256SUMS.txt"
