name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_pack.txt

      - name: Tracked Python and shell syntax
        run: python tools/check_source_syntax.py

      - name: Tests
        run: PYTHONPATH="$PWD" pytest -q tests -ra

      - name: Public-release validation
        run: python tools/validate_public_release.py

      - name: Validate active SFT mixture without publishing
        run: python tools/build_sft_mix.py --check-only

      - name: Train/eval decontamination (dry-run)
        run: python tools/check_train_eval_decontamination.py --dry-run

      - name: Strict holdout exact-overlap gate
        run: >-
          python tools/check_train_eval_decontamination.py
          --eval eval/strict_holdout_quality_control_v2.be.jsonl
          --dry-run --fail-on-overlap

      - name: Active generated SFT revision and strict holdout
        run: python tools/check_active_data.py
