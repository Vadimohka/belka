name: Materialize audited patch
on:
  push:
    branches: [codex/belka-complete-2026-10-01]
    paths: [.github/workflows/audit-apply.yml]
permissions:
  contents: write
jobs:
  materialize:
    if: github.ref == 'refs/heads/codex/belka-complete-2026-10-01'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/belka-complete-2026-10-01
          fetch-depth: 0
      - name: Verify transport, baseline, every preimage, patch and every postimage
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path.cwd()
          baseline = 'd6cd920d32901e194e2bc0e0300186698a8d4c65'
          expected = '14aff1e732225278c8b1fcee0da7fed6013035f346d1497a7563c5a1cacf688c'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          if git('status', '--porcelain'):
              raise SystemExit('dirty checkout')
          git('merge-base', '--is-ancestor', baseline, 'HEAD')
          folder = root / '.audit_payload'
          parts = sorted(folder.glob('part-*.txt'))
          if [p.name for p in parts] != [f'part-{i:02d}.txt' for i in range(10)]:
              raise SystemExit('incorrect transport part set')
          encoded = ''.join(p.read_text().strip() for p in parts)
          compressed = base64.b64decode(encoded, validate=True)
          decoder = lzma.LZMADecompressor(memlimit=256*1024*1024)
          raw = decoder.decompress(compressed, max_length=2*1024*1024)
          if not decoder.eof or decoder.unused_data or hashlib.sha256(raw).hexdigest() != expected:
              raise SystemExit('transport digest or compression limit mismatch')
          payload = json.loads(raw)
          if payload['schema_version'] != 1 or payload['baseline'] != baseline or len(payload['files']) != 53:
              raise SystemExit('unexpected patch contract')
          names = set()
          modes = {}
          for entry in payload['files']:
              path = pathlib.PurePosixPath(entry['path'])
              if path.is_absolute() or '..' in path.parts or path.parts[0].startswith('.'):
                  raise SystemExit('unsafe patch path')
              if path.parts[0] not in {'configs','data_pipeline','deploy','eval','export','ops','tests','tools','requirements_pack.txt'}:
                  raise SystemExit('unexpected patch path')
              if str(path) in names:
                  raise SystemExit('duplicate patch entry')
              names.add(str(path))
              target = root / path
              if target.is_symlink() or not target.resolve().is_relative_to(root):
                  raise SystemExit('unsafe target')
              before = hashlib.sha256(target.read_bytes()).hexdigest() if target.exists() else None
              if before != entry['before']:
                  raise SystemExit(f'preimage mismatch: {path}')
              modes[str(path)] = bool(target.stat().st_mode & 0o111) if target.exists() else entry['executable']
          temp = root / '.workspace/audit_transport'
          temp.mkdir(parents=True, exist_ok=True)
          patch = temp / 'changes.patch'
          patch.write_text(payload['patch'], encoding='utf-8')
          git('apply', '--check', str(patch))
          git('apply', '--index', '--whitespace=nowarn', str(patch))
          for entry in payload['files']:
              target = root / entry['path']
              if hashlib.sha256(target.read_bytes()).hexdigest() != entry['after']:
                  raise SystemExit(f'postimage mismatch: {target}')
              if bool(target.stat().st_mode & 0o111) != modes[entry['path']]:
                  raise SystemExit(f'executable mode mismatch: {target}')
          staged = set(git('diff', '--cached', '--name-only').splitlines())
          if staged != names:
              raise SystemExit('staged scope differs from audited scope')
          git('rm', '--', *[str(p.relative_to(root)) for p in parts])
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('commit', '-m', 'Implement audited Belka data, runtime and inference contracts')
          git('push', 'origin', 'HEAD:refs/heads/codex/belka-complete-2026-10-01')
          print('Published verified implementation commit', git('rev-parse', 'HEAD'))
          PY
