name: Audit source snapshot

on:
  workflow_dispatch:
  push:
    branches: [codex/belka-complete-2026-10-01]
    paths: [.github/workflows/audit-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Obtain pinned upstream without running its code
        run: |
          mkdir -p .workspace/audit
          git clone --filter=blob:none --no-checkout https://github.com/karpathy/nanochat.git .workspace/audit/upstream
          git -C .workspace/audit/upstream checkout --detach 92d63d4e8bb4df75c3b71618f31ddde2378b2bcd
          test "$(git -C .workspace/audit/upstream rev-parse HEAD)" = 92d63d4e8bb4df75c3b71618f31ddde2378b2bcd
      - name: Snapshot tracked text files with hashes (no credentials or model binaries)
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, subprocess, zipfile
          root = pathlib.Path.cwd()
          permitted = {'.py', '.sh', '.md', '.json', '.jsonl', '.yaml', '.yml', '.toml', '.ini', '.txt', '.html', '.svg', '.cff', '.lock'}
          report = {'schema_version': 1, 'files': [], 'omitted': [], 'revisions': {}}
          with zipfile.ZipFile(root / '.workspace/audit/source-snapshot.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for label, repo in [('belka', root), ('nanochat', root / '.workspace/audit/upstream')]:
                  report['revisions'][label] = subprocess.check_output(['git', '-C', str(repo), 'rev-parse', 'HEAD'], text=True).strip()
                  paths = subprocess.check_output(['git', '-C', str(repo), 'ls-files', '-z']).decode().split('\0')
                  for rel in sorted(filter(None, paths)):
                      p = repo / rel
                      allowed = (p.suffix in permitted or p.name in {'LICENSE', '.gitignore', '.python-version', 'path_policy.env', 'config.example.env'})
                      if p.is_symlink() or not p.is_file() or not allowed or p.stat().st_size > 2000000:
                          report['omitted'].append(label + '/' + rel)
                          continue
                      data = p.read_bytes()
                      try:
                          data.decode('utf-8')
                      except UnicodeError:
                          report['omitted'].append(label + '/' + rel)
                          continue
                      path = label + '/' + rel
                      archive.writestr(path, data)
                      report['files'].append({'path': path, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(), 'git_blob': hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()})
              archive.writestr('SNAPSHOT_MANIFEST.json', json.dumps(report, ensure_ascii=False, indent=2))
          print(json.dumps({'revisions': report['revisions'], 'files': len(report['files']), 'omitted': report['omitted']}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: source-audit-snapshot
          path: .workspace/audit/source-snapshot.zip
          retention-days: 3
          if-no-files-found: error
