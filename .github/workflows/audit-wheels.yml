name: Audit dependency wheels
on:
  push:
    branches: [codex/belka-completion-2026-09-30]
    paths: [.github/workflows/audit-wheels.yml]
permissions:
  contents: read
jobs:
  wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip download --only-binary=:all: --dest wheels pyarrow==21.0.0 tiktoken==0.11.0 rustbpe==0.1.0 zstandard==0.25.0 kernels==0.11.7 wandb==0.21.3
      - uses: actions/upload-artifact@v4
        with:
          name: belka-audit-wheels
          path: wheels/
          retention-days: 3
          if-no-files-found: error
