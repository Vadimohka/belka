name: One-shot Git branch cleanup

on: create

permissions:
  contents: write

concurrency:
  group: belka-branch-cleanup-2026-10-06
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.repository == 'Vadimohka/belka' &&
      github.event.ref_type == 'branch' &&
      github.event.ref == 'maintenance/branch-cleanup-2026-10-06'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify retained history and delete only exact reviewed refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          # Repository housekeeping only: no checkout, imports of project code,
          # installs, tests, corpus access, or training. No branch protection bypass.
          import base64
          import json
          import os
          import re
          import subprocess
          import tempfile
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = 'Vadimohka/belka'
          trigger = 'maintenance/branch-cleanup-2026-10-06'
          expected = {
              'codex/belka-complete-2026-10-01': '81c312e5075d1d6666410551cc7c5bb2cc2e7b65',
              'codex/belka-completion-2026-09-30': '265609515eb9ba32f2381f7061ea1234ec49dcd5',
              'codex/belka-runtime-2026-10-01': '38a80d119e1bef77d2cee7deec8e49d50a2a8203',
              'codex/belka-runtime-contracts-2026-09-29': '9db5ea6c09641f4cfdca22422f914af797b20b7b',
              'codex/belka-runtime-hardening-2026-09-30': '21a407a30db06efd200f5258acbd7de2a22f2244',
          }
          if os.environ['GITHUB_REPOSITORY'] != repo:
              raise SystemExit('Wrong repository')
          event = json.load(open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8'))
          if event.get('ref_type') != 'branch' or event.get('ref') != trigger:
              raise SystemExit('Wrong trigger')
          run_sha = os.environ['GITHUB_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', run_sha):
              raise SystemExit('Invalid trigger SHA')
          expected[trigger] = run_sha
          token = os.environ['GH_TOKEN']

          def api(path, *, missing_ok=False):
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + repo + path,
                  headers={'Authorization': 'Bearer ' + token,
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  if missing_ok and exc.code == 404:
                      return None
                  raise

          if api('')['default_branch'] != 'main':
              raise SystemExit('Default branch changed; nothing deleted')
          main_sha = api('/git/ref/heads/main')['object']['sha']
          if main_sha != run_sha:
              raise SystemExit('main moved after preparation; nothing deleted')
          selected = {}
          already_absent = []
          for name, sha in expected.items():
              branch = api('/branches/' + urllib.parse.quote(name, safe=''), missing_ok=True)
              if branch is None:
                  already_absent.append(name)
                  continue
              if branch['protected'] or branch['commit']['sha'] != sha:
                  raise SystemExit('Protected or changed branch; nothing deleted: ' + name)
              comparison = api('/compare/' + sha + '...' + main_sha + '?per_page=1')
              if (comparison['status'] not in ('ahead', 'identical')
                      or comparison['merge_base_commit']['sha'] != sha):
                  raise SystemExit('History not retained in main; nothing deleted: ' + name)
              selected[name] = sha
          if api('/git/ref/heads/main')['object']['sha'] != main_sha:
              raise SystemExit('main moved during verification; nothing deleted')

          # Authentication lives only in this child environment, never in a URL,
          # command argument, checked-in file, or printed configuration.
          git_env = {key: value for key, value in os.environ.items()
                     if not key.startswith('GIT_') and key != 'GH_TOKEN'}
          auth = base64.b64encode(('x-access-token:' + token).encode()).decode()
          git_env.update(GIT_TERMINAL_PROMPT='0', GIT_CONFIG_COUNT='2',
                         GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',
                         GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + auth,
                         GIT_CONFIG_KEY_1='credential.helper', GIT_CONFIG_VALUE_1='')
          if selected:
              with tempfile.TemporaryDirectory(prefix='belka-git-cleanup-') as directory:
                  subprocess.run(['git', 'init', '--bare', '--quiet', directory],
                                 env=git_env, check=True, timeout=15)
                  command = ['git', '-C', directory, 'push', '--atomic']
                  command += ['--force-with-lease=refs/heads/' + name + ':' + sha
                              for name, sha in selected.items()]
                  command += ['https://github.com/' + repo + '.git']
                  command += [':refs/heads/' + name for name in selected]
                  subprocess.run(command, env=git_env, check=True, timeout=90)
          remaining = [item['name'] for item in api('/branches?per_page=100')]
          if set(expected).intersection(remaining):
              raise SystemExit('Post-deletion verification failed')
          result = {'main_sha_at_cleanup': main_sha, 'deleted': selected,
                    'already_absent': already_absent, 'remaining_branches': remaining,
                    'project_code_executed': False}
          print(json.dumps(result, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('## Git-only branch cleanup\n\n```json\n')
              output.write(json.dumps(result, indent=2) + '\n```\n')
          PY
