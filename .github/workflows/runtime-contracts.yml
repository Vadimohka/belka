name: Runtime contracts

on:
  push:
    branches: [codex/belka-runtime-2026-10-01]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download pinned binary audit dependencies
        run: |
          python -m pip download --only-binary=:all: --dest .workspace/audit-wheels pyarrow==21.0.0 tiktoken==0.11.0 rustbpe==0.1.0
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('.workspace/audit-wheels')
          (root/'SHA256.json').write_text(json.dumps({p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.glob('*.whl')},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: audit-wheels
          path: .workspace/audit-wheels
          retention-days: 7
          if-no-files-found: error
