name: Offline CPU verification dependencies
on:
  pull_request:
    paths:
      - '.github/workflows/cpu-verification-deps.yml'
permissions:
  contents: read
jobs:
  wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download binary-only test dependencies from PyPI
        run: |
          mkdir -p wheels
          python -m pip download --only-binary=:all: --no-deps --dest wheels pyarrow==21.0.0 tiktoken==0.11.0 safetensors==0.6.2 zstandard==0.24.0
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          files = [{'file': p.name, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(Path('wheels').glob('*.whl'))]
          Path('wheels/SHA256.json').write_text(json.dumps(files, indent=2))
          print(json.dumps(files, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: offline-cpu-test-wheels
          path: wheels/
          retention-days: 1
