schema_version: 1
# Belka corpus expansion candidates. Priority policy:
#   A = public/open or documented; usable for expansion only if license/terms recorded.
#   B = permissioned-by-owner; usable with permission overlay, NO raw redistribution.
#   C = candidate_review_required; not used until owner approves.
# Rules: never use eval-only datasets for pretraining; never mix holdout/eval into train.
# See DATA_RIGHTS_AND_PERMISSIONS.md, configs/dataset_sources.yaml, reports/DATA_RIGHTS_MANIFEST.json.
policy:
  priority_A_requires_recorded_license: true
  priority_B_requires_permission_overlay_no_raw_redistribution: true
  priority_C_blocked_until_owner_approval: true
  eval_only_never_pretrain: true
  holdout_never_in_train: true

