    priority: A
    intended_use: {pretraining: true, tokenizer: true, sft: false, eval: false}
    original_license: CC BY-SA 4.0 / GFDL
    license_url: https://dumps.wikimedia.org/legal.html
    terms_url: https://foundation.wikimedia.org/wiki/Terms_of_Use
    permission_status: not_required
    permission_basis: public_license
    redistribution: {raw_data: open_under_source_license, processed_data: open_under_source_license, model_outputs: allowed, derived_model: allowed}
