# Candidate configurations for ONE H200; measured hardware acceptance is required.
version: 2
target:
  accelerator: H200
  ngpus: 1
  precision: bfloat16
  memory_fraction: 0.88
  official_specification: https://www.nvidia.com/en-gb/data-center/h200/
profiles:
  h200_quality:
    description: Conservative quality baseline; compare validation before scaling.
    depth: 16
    aspect_ratio: 64
    head_dim: 128
    max_seq_len: 2048
    window_pattern: L
    device_batch_candidates: [8, 16, 32]
    total_batch_size: 131072
    target_epochs: 3.0
    sft_epochs: 3.0
    sft_max_seq_len: 256
    sft_device_batch_size: 4
    sft_total_batch_size: 4096
    tokenizer_vocab_size: 32768
    early_stopping_patience: 3
  h200_max:
    description: Larger single-H200 candidate for the expanded cleaned corpus.
    depth: 24
    aspect_ratio: 64
    head_dim: 128
    max_seq_len: 2048
    window_pattern: L
    device_batch_candidates: [4, 8, 16, 32]
    total_batch_size: 262144
    target_epochs: 3.0
    sft_epochs: 3.0
    sft_max_seq_len: 256
    sft_device_batch_size: 4
    sft_total_batch_size: 4096
    tokenizer_vocab_size: 32768
    early_stopping_patience: 3
  h200_large:
    description: Optional depth-32 scaling experiment; requires the same measured probe.
    depth: 32
    aspect_ratio: 64
    head_dim: 128
    max_seq_len: 2048
    window_pattern: L
    device_batch_candidates: [2, 4, 8, 16]
    total_batch_size: 262144
    target_epochs: 3.0
    sft_epochs: 3.0
    sft_max_seq_len: 256
    sft_device_batch_size: 4
    sft_total_batch_size: 4096
    tokenizer_vocab_size: 32768
    early_stopping_patience: 3
  smoke:
    description: Tiny pipeline acceptance, never a model-quality claim.
    depth: 2
    aspect_ratio: 32
    head_dim: 32
    max_seq_len: 256
    window_pattern: L
    device_batch_candidates: [1, 2]
    total_batch_size: 512
    base_iterations: 3
    sft_iterations: 3
    sft_max_seq_len: 256
    sft_device_batch_size: 1
    sft_total_batch_size: 256
    tokenizer_vocab_size: 32768
    early_stopping_patience: 0
aliases:
  quality_v4: h200_quality
  max_d24: h200_max
common_env:
  NANOCHAT_DTYPE: bfloat16
  PYTORCH_ALLOC_CONF: expandable_segments:True
  BELKA_DISABLE_GENERIC_EVALS: 'YES'
  WANDB_MODE: disabled
  WANDB_DISABLED: 'true'
  OMP_NUM_THREADS: '1'
quality_policy:
  precision: BF16; FP8 is a separate comparison and never silently enabled.
  model_selection: Lowest measured validation BPB among committed base checkpoints.
  sft: Separate small token batch; never reuse the large base batch for seed-sized SFT.
  hardware: Benchmark forward/backward/optimizer and select the fastest batch within the memory reserve.
  corpus: Cleaned immutable generation, exact counts with BOS, train-only tokenizer, untouched holdout.
