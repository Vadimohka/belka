# Source mixing policy — from-scratch Belka training
version: "1.0"

# synthetic flag, quality_score_min, duplicate_count_preserved, source_weight

sources:
  bewiki:
    source_id: "bewiki"
    orthography: "narkamauka"
    synthetic: false
    quality_score_min: 0.45
    min_chars: 120
    source_weight: 1.0
    category: "encyclopedic"

  be_x_oldwiki:
    source_id: "be_x_oldwiki"
    orthography: "tarask"
    synthetic: false
    quality_score_min: 0.45
    min_chars: 120
    source_weight: 0.4
    category: "encyclopedic"
    note: "separate_from_narkamauka"

  bewikisource:
    source_id: "bewikisource"
    orthography: "mixed"
    synthetic: false
    quality_score_min: 0.55
    min_chars: 400
    source_weight: 0.6
    category: "literary_strict_filter"

  ud_belarusian_hse:
    source_id: "ud_belarusian_hse"
    orthography: "mixed"
    synthetic: false
    quality_score_min: 0.50
    min_chars: 30
    source_weight: 0.15
    category: "grammar_eval_mostly"

  tatoeba_sentences:
    source_id: "tatoeba_sentences"
    orthography: "mixed"
    synthetic: false
    quality_score_min: 0.50
    min_chars: 30
    source_weight: 0.15
    category: "sentence_level"

  morphodict-bel:
    source_id: "morphodict-bel"
    orthography: "narkamauka"
    synthetic: false
    quality_score_min: 0.55
    min_chars: 10
    source_weight: 0.0
    category: "excluded_from_base"

  belarusianglue:
    source_id: "belarusianglue"
    orthography: "narkamauka"
    synthetic: false
    quality_score_min: 0.55
    min_chars: 50
    source_weight: 0.0
    category: "eval_only_no_train"

  bootstrap:
    source_id: "bootstrap"
    orthography: "narkamauka"
    synthetic: true
    quality_score_min: 0.45
    min_chars: 60
    source_weight: 0.8
    category: "synthetic_seed"

  belacorpus_public_research:
    source_id: "belacorpus_public_research"
    orthography: "narkamauka"
    synthetic: false
    quality_score_min: 0.55
    min_chars: 150
    source_weight: 0.8
    access_status: "manual_request_required"
    category: "pending_access"

  oscar-2301-be:
    source_id: "oscar-2301-be"
    orthography: "mixed"
    synthetic: false
    quality_score_min: 0.55
    min_chars: 150
    source_weight: 0.6
    access_status: "gated_hf_login_required"
    category: "web_corpus"

  culturax-be:
    source_id: "culturax-be"
    orthography: "mixed"
    synthetic: false
    quality_score_min: 0.55
    min_chars: 150
    source_weight: 0.5
    access_status: "gated_hf_login_required"
    category: "web_corpus"

  mc4-be:
    source_id: "mc4-be"
    orthography: "mixed"
    synthetic: false
    quality_score_min: 0.55
    min_chars: 150
    source_weight: 0.4
    access_status: "gated_hf_login_required"
    category: "web_corpus"

  cc100-be:
    source_id: "cc100-be"
    orthography: "unknown"
    synthetic: false
    quality_score_min: 0.55
    min_chars: 150
    source_weight: 0.0

mixing_formula: "weighted_sampling_by_source_weight"
synthetic_cap: 0.15
tarask_ratio_min: 0.03
tarask_ratio_max: 0.10

output_parquet_schema:
  - text
  - source
  - source_id
  - orthography
  - synthetic
  - quality_score
  - duplicate_count
  - chars
  - doc_id
